name: PHP Tests

on:
    push:
        branches: [master]
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    test:
        name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                dependencies: ["lowest", "highest"]
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: radiant
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping --silent"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: radiant
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            RADIANT_MYSQL_HOST: 127.0.0.1
            RADIANT_MYSQL_PORT: "3306"
            RADIANT_MYSQL_USER: root
            RADIANT_MYSQL_PASSWORD: root
            RADIANT_MYSQL_DATABASE: radiant
            RADIANT_PGSQL_HOST: 127.0.0.1
            RADIANT_PGSQL_PORT: "5432"
            RADIANT_PGSQL_USER: postgres
            RADIANT_PGSQL_PASSWORD: postgres
            RADIANT_PGSQL_DATABASE: radiant
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none
                  extensions: pdo, pdo_mysql, pdo_pgsql

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  # composer.lock is committed, so this hash is real and
                  # distinct per resolved tree — the lowest/highest legs
                  # never share a stale vendor restore.
                  key: ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-

            - name: Install dependencies
              run: |
                  composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
                  composer dump-autoload

            - name: Run tests
              run: composer test

            - name: Run static analysis
              run: composer analyse

            - name: Run dependency audit
              run: composer security:audit