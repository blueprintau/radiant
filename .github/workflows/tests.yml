name: PHP Tests

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:
    workflow_dispatch:

# Least privilege: this workflow only reads code and runs tests — it never
# needs to write. Explicitly scoping GITHUB_TOKEN closes the chain where a
# compromised third-party action or dependency resolution reaches repo
# write (and, for a library, ultimately consumer installs).
permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                dependencies: ["lowest", "highest"]
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: radiant
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping --silent"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: radiant
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            mariadb:
                image: mariadb:11.4
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: radiant
                ports:
                    - 3307:3306
                options: >-
                    --health-cmd "mariadb-admin ping --silent"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            RADIANT_MYSQL_HOST: 127.0.0.1
            RADIANT_MYSQL_PORT: "3306"
            RADIANT_MYSQL_USER: root
            RADIANT_MYSQL_PASSWORD: root
            RADIANT_MYSQL_DATABASE: radiant
            RADIANT_MARIADB_HOST: 127.0.0.1
            RADIANT_MARIADB_PORT: "3307"
            RADIANT_MARIADB_USER: root
            RADIANT_MARIADB_PASSWORD: root
            RADIANT_MARIADB_DATABASE: radiant
            RADIANT_PGSQL_HOST: 127.0.0.1
            RADIANT_PGSQL_PORT: "5432"
            RADIANT_PGSQL_USER: postgres
            RADIANT_PGSQL_PASSWORD: postgres
            RADIANT_PGSQL_DATABASE: radiant
        steps:
            # Actions are SHA-pinned (movable tags can be retargeted by the
            # action repo's maintainers with no diff in this repo).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none
                  extensions: pdo, pdo_mysql, pdo_pgsql

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: vendor
                  # composer.lock is committed, so this hash is real and
                  # distinct per resolved tree — the lowest/highest legs
                  # never share a stale vendor restore.
                  key: ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-

            - name: Install dependencies
              # The `highest` leg installs the COMMITTED lock (`composer
              # install` installs from composer.lock when present — it never
              # re-resolves) so tests and `composer audit --locked` exercise
              # the exact reviewed, reproducible tree. Only the lowest-bounds
              # leg resolves — that is its purpose.
              # Note: `--locked` is not an install option (it belongs to
              # update/audit), so it must not be passed here.
              run: |
                  if [ "${{ matrix.dependencies }}" = "lowest" ]; then
                      composer update --no-interaction --prefer-dist --prefer-lowest
                  else
                      composer install --no-interaction --prefer-dist
                  fi
                  composer dump-autoload

            - name: Run tests
              # test:all = default group + integration-remote-sql (repeated
              # --group flags, NOT comma-separated — a comma value is treated
              # as one group name and matches nothing). The service
              # containers above ARE the required servers, so the live
              # MySQL/Postgres suites run here; a failure is a real signal
              # (they fail, never skip). The sqlite integration suite needs
              # no server and rides the default group.
              run: composer test:all

            - name: Run static analysis
              run: composer analyse

            - name: Run dependency audit
              run: composer security:audit