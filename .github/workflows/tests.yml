name: PHP Tests

on:
    push:
        branches: [master]
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    test:
        name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]
                dependencies: ["lowest", "highest"]
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-deps${{ matrix.dependencies }}-

            - name: Install dependencies
              run: |
                  composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
                  composer dump-autoload

            - name: Run tests
              run: composer test

            - name: Run static analysis
              run: composer analyse

            - name: Run dependency audit
              run: composer security:audit