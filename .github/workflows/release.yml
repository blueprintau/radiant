name: Release

# Releases are tag-driven: pushing a plain semver tag (e.g. 1.0.0) creates
# the GitHub Release. This is safe because the full test suite runs on every
# push to main, so any commit a tag can point at is already known green.
on:
    push:
        tags:
            # Coarse glob pre-filter only: GitHub tag patterns are globs, not
            # regexes, so they cannot express "one or more digits" precisely.
            # These admit anything that plausibly looks like a version; the
            # strict regex in the job is the authoritative gate. Plain semver
            # only (no "v" prefix) so Packagist/Composer tags stay consistent
            # and duplicate v-prefixed tags (e.g. both 1.2.3 and v1.2.3) can
            # never diverge. Prerelease suffixes allowed.
            - "[0-9]*.[0-9]*.[0-9]*"
            - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Gate: run the full test suite against the tagged commit before
    # releasing. tests.yml is a reusable workflow (workflow_call), so it is
    # invoked directly here — the release job below only proceeds if every
    # matrix leg (PHP 8.4/8.5 × lowest/highest) is green on this exact ref.
    # This matters because a tag can point at any commit, including one that
    # was never pushed to main, so "tests passed on main" is not sufficient.
    test:
        uses: ./.github/workflows/tests.yml
        permissions:
            contents: read

    release:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Validate tag shape
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  # Authoritative gate. The push filter is a coarse glob that
                  # cannot express semver precisely (no "one or more digits"),
                  # so it admits junk like 1.2.3.4 or ..1.2.3. Reject those
                  # here: a malformed tag fails the run and the release is
                  # never created.
                  #
                  # The prerelease suffix is restricted to Composer's
                  # recognized stability keywords (dev/alpha/beta/RC, with
                  # optional numeric part). Anything else (e.g. 1.0.0-hotfix)
                  # would be a prerelease on GitHub but resolve as STABLE on
                  # Packagist — a mismatch that could ship a pre-release as
                  # the latest stable version to consumers.
                  if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(dev|alpha|beta|RC)(\.[0-9]+)?)?$'; then
                      echo "Tag '$VERSION' is not a valid semver tag (expected e.g. 1.2.3 or 1.2.3-beta.1, no 'v' prefix)."
                      exit 1
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ github.ref_name }}
                  generate_release_notes: true
                  draft: false
                  # A tag like 1.0.0-beta.1 must not be published as the
                  # latest stable release.
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  make_latest: ${{ !contains(github.ref_name, '-') }}