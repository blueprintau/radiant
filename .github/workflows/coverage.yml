name: Coverage

# Generates a line-coverage HTML report and deploys it to GitHub Pages
# on main via the official Pages deployment flow (OIDC, no gh-pages
# branch). Kept separate from tests.yml because the deploy needs
# `pages: write` + `id-token: write` — tests.yml stays least-privilege
# at `contents: read`.
#
# The report is served at https://blueprintau.github.io/radiant/ and
# the Shields badge in the README reads
# .../radiant/coverage-badge.json from the same deployment. PR runs
# still produce the report as a downloadable workflow artifact.
on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "tests/**"
            - "phpunit.xml"
            - "composer.json"
            - "composer.lock"
            - "ci/**"
            - ".github/workflows/coverage.yml"
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "phpunit.xml"
            - "composer.json"
            - "composer.lock"
            - "ci/**"
            - ".github/workflows/coverage.yml"
    workflow_dispatch:

# The Pages deploy authenticates via OIDC (id-token) and writes only to
# the Pages deployment — no repo contents write, no branch pushes.
permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: coverage-pages
    cancel-in-progress: true

jobs:
    coverage:
        runs-on: ubuntu-latest
        environment:
            # Required by the official deploy-pages action; create the
            # "github-pages" environment in repo settings when enabling
            # Pages.
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: radiant
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping --silent"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: radiant
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            mariadb:
                image: mariadb:11.4
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: radiant
                ports:
                    - 3307:3306
                options: >-
                    --health-cmd "mariadb-admin ping --silent"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            RADIANT_MYSQL_HOST: 127.0.0.1
            RADIANT_MYSQL_PORT: "3306"
            RADIANT_MYSQL_USER: root
            RADIANT_MYSQL_PASSWORD: root
            RADIANT_MYSQL_DATABASE: radiant
            RADIANT_MARIADB_HOST: 127.0.0.1
            RADIANT_MARIADB_PORT: "3307"
            RADIANT_MARIADB_USER: root
            RADIANT_MARIADB_PASSWORD: root
            RADIANT_MARIADB_DATABASE: radiant
            RADIANT_PGSQL_HOST: 127.0.0.1
            RADIANT_PGSQL_PORT: "5432"
            RADIANT_PGSQL_USER: postgres
            RADIANT_PGSQL_PASSWORD: postgres
            RADIANT_PGSQL_DATABASE: radiant
        steps:
            # Actions are SHA-pinned (movable tags can be retargeted by the
            # action repo's maintainers with no diff in this repo).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  # Single leg: coverage is a reporting concern, not a
                  # compatibility matrix — tests.yml already covers 8.4/8.5
                  # x lowest/highest.
                  php-version: "8.4"
                  tools: composer:v2
                  # pcov over xdebug: same line data, a fraction of the
                  # runtime overhead on a suite this size.
                  coverage: pcov
                  extensions: pdo, pdo_mysql, pdo_pgsql

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: vendor
                  key: ${{ runner.os }}-php8.4-coverage-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php8.4-coverage-

            - name: Install dependencies
              # The committed lock: the coverage numbers should describe the
              # exact reviewed, reproducible dependency tree.
              run: composer install --no-interaction --prefer-dist

            - name: Run tests with coverage
              # Single PHPUnit process over the FULL suite — the same
              # selection as `composer test:all` (default +
              # integration-remote-sql). The service containers above ARE
              # the required servers, so the integration group runs here
              # rather than being excluded by phpunit.xml. One process
              # means one coverage object: no merging, no undercount.
              # NOTE: repeated --group flags, NOT a comma-separated value —
              # PHPUnit 13 treats "default,integration-remote-sql" as a
              # single group name and matches nothing (verified locally).
              # PHPUnit renders the HTML report (native light/dark themes)
              # and Clover XML itself; only the badge JSON needs a script.
              run: |
                  php vendor/bin/phpunit --no-progress \
                      --group default \
                      --group integration-remote-sql \
                      --coverage-html coverage-report \
                      --coverage-clover coverage-report/coverage.xml \
                      --coverage-php coverage.php

            - name: Build coverage badge
              # The one artifact PHPUnit cannot emit: the Shields endpoint
              # JSON. A separate script (not inline php -r) so it can be
              # syntax-checked and dry-run locally.
              run: php ci/coverage-badge.php

            - name: Upload coverage artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: coverage-report
                  # The badge JSON rides along (it is generated inside
                  # coverage-report/) so PR runs can inspect it without a
                  # Pages deploy.
                  path: coverage-report
                  retention-days: 14

            # Official Pages flow: upload the report as a Pages artifact,
            # then deploy it via the Pages API with OIDC. No gh-pages
            # branch, no contents:write, no third-party action.
            - name: Configure Pages
              if: github.ref == 'refs/heads/main'
              id: pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: coverage-report

            - name: Deploy to GitHub Pages
              if: github.ref == 'refs/heads/main'
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
